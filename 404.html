<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0f766e">
    <title>الصفحة غير موجودة | FinnMarket</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #f5f7f8;
            color: #17212b;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, rgba(15, 118, 110, 0.14), transparent 34rem),
                #f5f7f8;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(28px, 7vw, 56px);
            text-align: center;
            background: #fff;
            border: 1px solid #dce5e7;
            border-radius: 24px;
            box-shadow: 0 24px 64px rgba(23, 33, 43, 0.09);
        }

        .status {
            margin: 0;
            color: #0f766e;
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.06em;
        }

        h1 {
            margin: 20px 0 10px;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
        }

        p {
            margin: 0 auto 28px;
            max-width: 46ch;
            color: #55636f;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        a,
        button {
            min-height: 46px;
            padding: 11px 20px;
            border-radius: 12px;
            border: 1px solid #0f766e;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            background: #0f766e;
        }

        button {
            color: #0f766e;
            background: #fff;
        }

        a:hover,
        a:focus-visible { background: #0b5f59; }
        button:hover,
        button:focus-visible { background: #eaf6f4; }
        a:focus-visible,
        button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="status" aria-hidden="true">404</p>
        <h1>الصفحة غير موجودة</h1>
        <p>قد يكون الرابط غير صحيح أو أن الإعلان لم يعد متاحًا. يمكنك العودة إلى السوق ومتابعة البحث.</p>
        <nav aria-label="خيارات الرجوع">
            <a href="/">العودة إلى السوق</a>
            <button type="button" onclick="history.back()">الرجوع للصفحة السابقة</button>
        </nav>
    </main>
</body>
</html>
