<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الإعلان | FinnMarket</title>
    <meta id="listingMetaDescription" name="description" content="تفاصيل إعلان منشور في FinnMarket السعودية.">
    <meta id="listingRobots" name="robots" content="index,follow,max-image-preview:large">
    <link id="listingCanonical" rel="canonical" href="https://fann1.netlify.app/listing.html">
    <meta id="listingOgTitle" property="og:title" content="تفاصيل الإعلان | FinnMarket"><meta id="listingOgDescription" property="og:description" content="تفاصيل إعلان منشور في FinnMarket السعودية.">
    <meta id="listingOgUrl" property="og:url" content="https://fann1.netlify.app/listing.html"><meta property="og:type" content="product"><meta property="og:locale" content="ar_SA"><meta property="og:site_name" content="FinnMarket">
    <meta id="listingOgImage" property="og:image" content="">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS v6.0 -->
    <link rel="stylesheet" href="css/main.css?v=13.0">
    <link rel="stylesheet" href="css/components.css?v=14.0">
    <link rel="stylesheet" href="css/legal.css?v=1.0">

    <style>
        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .breadcrumb-nav a {
            color: var(--color-primary);
            font-weight: 600;
        }

        .listing-detail-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            margin-bottom: 60px;
        }

        .listing-detail-layout > * {
            min-width: 0;
        }

        @media (max-width: 992px) {
            .listing-detail-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .breadcrumb-nav {
                flex-wrap: wrap;
            }

            #mainListingCol > div:first-child,
            .comments-section-box {
                padding: 18px !important;
            }

            #mainListingCol > div:first-child > div:first-child {
                align-items: flex-start !important;
                flex-wrap: wrap;
            }

        }

        .gallery-main-box {
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
        }

        .gallery-main-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            .gallery-main-box {
                height: auto;
                aspect-ratio: 4 / 3;
            }
        }

        .gallery-thumbs-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            overflow-x: auto;
        }

        .gallery-thumb-item {
            width: 90px;
            height: 70px;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition-fast);
            padding: 0;
            background: transparent;
        }

        .gallery-thumb-item.active {
            border-color: var(--color-primary);
        }

        .gallery-thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comments-section-box {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 28px;
            margin-top: 32px;
        }

        .comment-card {
            display: flex;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid var(--bg-surface-subtle);
        }

        .comment-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
        }

        .seller-badge-tag {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-full);
        }

        .member-badge-tag {
            background-color: #ecfdf5;
            color: #059669;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-full);
        }

        .add-reply-box {
            margin-top: 24px;
            background-color: var(--bg-body);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .rating-box-wrapper {
            background: #fffbebf5;
            border: 1px solid #fef3c7;
            padding: 14px;
            border-radius: var(--radius-md);
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="brand-logo">
                <i class="fa-solid fa-shapes"></i>
                <span>FinnMarket</span>
                <span class="brand-badge">سوق حقيقي موثق</span>
            </a>

            <div class="nav-actions" id="headerAuthNav">
                <!-- User Profile or Auth Trigger rendered dynamically -->
            </div>
        </div>
    </header>

    <!-- Main Listing Detail Page Content -->
    <main class="container" style="margin-top: 24px;">
        <!-- Breadcrumb -->
        <div class="breadcrumb-nav">
            <a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <i class="fa-solid fa-chevron-left"></i>
            <span id="bcCategory">القطاع</span>
            <i class="fa-solid fa-chevron-left"></i>
            <span id="bcTitle" style="color: var(--text-main); font-weight: 700;">عنوان الإعلان</span>
        </div>

        <div class="listing-detail-layout" id="listingPageContainer">
            <div id="mainListingCol">
                <!-- Injected via JS -->
            </div>

            <div id="sidebarListingCol">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

<footer class="site-footer"><div class="container site-footer-inner"><p>© 2026 FinnMarket</p><nav class="site-footer-links" aria-label="روابط معلوماتية"><a href="about.html">عن المنصة</a><a href="privacy.html">الخصوصية</a><a href="terms.html">الشروط</a><a href="safety.html">الأمان</a><a href="contact.html">التواصل</a></nav></div></footer>

    <div class="modal-overlay" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="reportDialogTitle" aria-hidden="true" hidden inert>
        <div class="modal-box" style="max-width: 520px; padding: 28px;" tabindex="-1">
            <button type="button" class="modal-close-btn" onclick="closeReportModal()" aria-label="إغلاق البلاغ"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            <h2 id="reportDialogTitle" style="font-size: 20px; font-weight: 900; margin-bottom: 8px;"><i class="fa-solid fa-flag" style="color: var(--color-danger);"></i> إرسال بلاغ</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">اشرح المخالفة بوضوح. سيظهر البلاغ للمشرفين فقط.</p>
            <div class="auth-notice info" style="margin-bottom: 14px;"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> نظام البلاغات فعّال ومحمي؛ تُرسل البيانات مباشرة إلى لوحة المشرفين.</div>
            <label class="filter-label" for="reportCategory">نوع المخالفة</label>
            <select id="reportCategory" class="form-input" style="padding:12px; margin-bottom:12px;"><option value="fraud">احتيال</option><option value="prohibited">محتوى أو منتج محظور</option><option value="misleading">معلومات أو سعر مضلل</option><option value="duplicate">إعلان مكرر</option><option value="abuse">إساءة</option><option value="spam">رسائل مزعجة</option><option value="privacy">انتهاك الخصوصية</option><option value="other">سبب آخر</option></select>
            <label class="filter-label" for="reportReason">تفاصيل البلاغ</label>
            <textarea id="reportReason" class="form-input" maxlength="2000" style="height: 110px; padding: 12px;" placeholder="اشرح المخالفة بوضوح، أو اترك التفاصيل فارغة..."></textarea>
            <label class="filter-label" for="reportEvidence" style="margin-top:12px;">روابط الأدلة (اختياري)</label>
            <textarea id="reportEvidence" class="form-input" maxlength="1502" style="height:75px; padding:12px;" placeholder="حتى 3 روابط HTTPS، رابط واحد في كل سطر"></textarea>
            <button type="button" class="btn btn-primary" id="submitReportButton" style="width:100%; margin-top:12px; background:var(--color-danger);" onclick="submitListingReport()">
                <i class="fa-solid fa-paper-plane"></i> إرسال البلاغ للمراجعة
            </button>
        </div>
    </div>

    <!-- Supabase JS Client SDK + Production Scripts v6.0 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
    <script src="js/data.js?v=10.0"></script>
    <script src="js/security.js?v=10.0"></script>
    <script src="js/supabase-config.js?v=16.0"></script>
    <script>
        let currentItem = null;
        let currentUser = null;
        let reportReturnFocus = null;
        let activeReportRatingId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await finnDB.getAuthUser();
            await finnDB.syncFavorites();
            await renderHeaderAuth();

            const urlParams = new URLSearchParams(window.location.search);
            const listingId = urlParams.get('id');
            if (!listingId) {
                renderMissingListing();
                return;
            }
            
            try {
                currentItem = await finnDB.getListingById(listingId);
            } catch (error) {
                console.error(error);
                renderMissingListing();
                return;
            }

            if (!currentItem) {
                renderMissingListing();
                return;
            }
            
            try {
                const [comments, seller, ratingStats] = await Promise.all([
                    finnDB.getListingComments(currentItem.id),
                    finnDB.getListingSeller(currentItem.id),
                    finnDB.getSellerRating(currentItem.userId).catch((error) => {
                        console.error(error);
                        return { average: 0, count: 0 };
                    })
                ]);
                currentItem.comments = comments;
                if (seller) currentItem.seller = seller;
                currentItem.ratingStats = ratingStats;
            } catch (error) {
                console.error(error);
                currentItem.comments = [];
            }

            document.getElementById('bcCategory').textContent = currentItem.subCategory;
            document.getElementById('bcTitle').textContent = currentItem.title;
            updateListingSeo(currentItem);

            await renderListingPageContent();
        });

        function renderMissingListing() {
            document.getElementById('bcCategory').textContent = 'الإعلانات';
            document.getElementById('bcTitle').textContent = 'الإعلان غير متاح';
            document.getElementById('mainListingCol').innerHTML = `
                <section style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 48px 24px; text-align: center;">
                    <i class="fa-regular fa-folder-open" aria-hidden="true" style="font-size: 52px; color: var(--text-muted); margin-bottom: 18px;"></i>
                    <h1 style="font-size: 24px; margin-bottom: 10px;">الإعلان غير متاح</h1>
                    <p style="color: var(--text-muted); margin-bottom: 22px;">ربما حُذف الإعلان أو انتهت صلاحيته أو أن الرابط غير صحيح.</p>
                    <a class="btn btn-primary" href="index.html"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> العودة إلى جميع الإعلانات</a>
                </section>
            `;
            document.title = 'الإعلان غير متاح | FinnMarket';
            document.getElementById('listingRobots').content = 'noindex,follow';
        }

        function updateListingSeo(item) {
            const canonicalUrl = `https://fann1.netlify.app/listing.html?id=${encodeURIComponent(item.id)}`;
            const description = String(item.description || `${item.title} في ${item.city}`).replace(/\s+/g, ' ').trim().slice(0, 155);
            document.title = `${item.title} في ${item.city} | FinnMarket`;
            document.getElementById('listingMetaDescription').content = description;
            document.getElementById('listingCanonical').href = canonicalUrl;
            document.getElementById('listingOgTitle').content = document.title;
            document.getElementById('listingOgDescription').content = description;
            document.getElementById('listingOgUrl').content = canonicalUrl;
            const image = item.images?.find(url => /^https:\/\//i.test(url));
            if (image) document.getElementById('listingOgImage').content = image;
        }

        async function renderHeaderAuth() {
            const authNav = document.getElementById('headerAuthNav');
            const favCount = finnDB.getFavorites().length;

            if (currentUser) {
                authNav.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn btn-outline btn-icon" onclick="window.location.href='index.html'" title="المفضلة">
                            <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
                            <span class="badge-count">${favCount}</span>
                        </button>

                        <div class="account-menu" id="listingAccountMenu">
                            <button type="button" class="user-profile-btn" id="listingAccountMenuButton" onclick="toggleListingAccountMenu(event)" aria-haspopup="menu" aria-expanded="false" title="قائمة الحساب">
                                <img src="${escapeHTML(safeHttpUrl(currentUser.avatar, DEFAULT_AVATAR))}" class="user-avatar-head" alt="">
                                <span class="account-menu-user-name">${escapeHTML(currentUser.name)}</span>
                                <i class="fa-solid fa-chevron-down account-menu-chevron" aria-hidden="true"></i>
                            </button>
                            <div class="account-dropdown" id="listingAccountDropdown" role="menu" hidden>
                                <a href="profile.html?tab=myAds" class="account-dropdown-item" role="menuitem"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>إعلاناتي</span></a>
                                <a href="profile.html?tab=favs" class="account-dropdown-item" role="menuitem"><i class="fa-solid fa-heart" aria-hidden="true"></i><span>المفضلة</span></a>
                                <a href="profile.html?tab=settings" class="account-dropdown-item" role="menuitem"><i class="fa-solid fa-user-gear" aria-hidden="true"></i><span>الحساب</span></a>
                                <button type="button" class="account-dropdown-item account-dropdown-logout" role="menuitem" onclick="handleHeaderLogout()"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>تسجيل خروج</span></button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                authNav.innerHTML = `
                    <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
                `;
            }
        }

        async function handleHeaderLogout() {
            if (confirm('هل ترغب في تسجيل الخروج نهائياً؟')) {
                await finnDB.logoutUser();
                alert('تم تسجيل الخروج بنجاح.');
                window.location.reload();
            }
        }

        function toggleListingAccountMenu(event) {
            event?.stopPropagation();
            const menu = document.getElementById('listingAccountMenu');
            const dropdown = document.getElementById('listingAccountDropdown');
            const button = document.getElementById('listingAccountMenuButton');
            if (!menu || !dropdown || !button) return;
            const shouldOpen = dropdown.hidden;
            dropdown.hidden = !shouldOpen;
            menu.classList.toggle('open', shouldOpen);
            button.setAttribute('aria-expanded', String(shouldOpen));
        }

        function closeListingAccountMenu() {
            const menu = document.getElementById('listingAccountMenu');
            const dropdown = document.getElementById('listingAccountDropdown');
            const button = document.getElementById('listingAccountMenuButton');
            if (!dropdown || dropdown.hidden) return;
            dropdown.hidden = true;
            menu?.classList.remove('open');
            button?.setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', (event) => {
            if (!event.target.closest('#listingAccountMenu')) closeListingAccountMenu();
        });
        document.addEventListener('keydown', (event) => {
            const reportModal = document.getElementById('reportModal');
            if (reportModal?.classList.contains('active')) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeReportModal();
                    return;
                }
                if (event.key === 'Tab') {
                    const focusable = [...reportModal.querySelectorAll('button:not([disabled]), textarea, select, input, [tabindex]:not([tabindex="-1"])')].filter(element => element.getClientRects().length);
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    if (event.shiftKey && document.activeElement === first) {
                        event.preventDefault();
                        last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                        event.preventDefault();
                        first.focus();
                    }
                }
                return;
            }
            if (event.key === 'Escape') {
                closeListingAccountMenu();
                document.getElementById('listingAccountMenuButton')?.focus();
            }
        });

        async function renderListingPageContent() {
            const mainCol = document.getElementById('mainListingCol');
            const isFav = finnDB.getFavorites().includes(currentItem.id);
            const formattedPrice = currentItem.isFree ? 'مجاناً 0 ر.س' : `${currentItem.price.toLocaleString('ar-SA')} ر.س`;
            
            const isOwner = Boolean(currentUser && currentItem.userId === currentUser.id);

            mainCol.innerHTML = `
                <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span class="badge-tag badge-${escapeHTML(currentItem.category)}" style="position: static; display: inline-block;">${escapeHTML(currentItem.subCategory)}</span>
                        
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-outline" onclick="togglePageFav('${currentItem.id}')" style="height: 38px; color: ${isFav ? '#ef4444' : 'var(--text-muted)'};">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i> ${isFav ? 'في المفضلة' : 'حفظ في المفضلة'}
                            </button>

                            ${isOwner ? `
                                <button class="btn btn-outline" style="height: 38px;" onclick="window.location.href='index.html?edit=${encodeURIComponent(currentItem.id)}'">
                                    <i class="fa-solid fa-pen-to-square"></i> تعديل الإعلان
                                </button>
                                <button class="btn btn-outline" style="height: 38px; color: #ef4444; border-color: #ef4444;" onclick="handleDeleteAd('${currentItem.id}')">
                                    <i class="fa-solid fa-trash"></i> حذف الإعلان
                                </button>
                            ` : `
                                <button class="btn btn-outline" style="height: 38px; color: var(--color-danger);" onclick="openReportModal()">
                                    <i class="fa-regular fa-flag"></i> إبلاغ
                                </button>
                            `}
                        </div>
                    </div>

                    <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 12px; line-height: 1.4;">${escapeHTML(currentItem.title)}</h1>
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
                        <i class="fa-solid fa-location-dot" style="color: var(--color-primary);"></i> ${escapeHTML([currentItem.city, currentItem.neighborhood].filter(Boolean).join(' - '))}
                        &nbsp;•&nbsp; <i class="fa-regular fa-clock"></i> ${escapeHTML(currentItem.timeAgo)}
                    </p>

                    <!-- Main Gallery Slider -->
                    <div class="gallery-main-box">
                        <img id="mainHeroImg" src="${escapeHTML(safeHttpUrl(currentItem.images[0], DEFAULT_LISTING_IMAGE))}" alt="${escapeHTML(currentItem.title)}" onerror="this.src='${DEFAULT_LISTING_IMAGE}'">
                    </div>
                    
                    ${currentItem.images.length > 1 ? `
                        <div class="gallery-thumbs-row">
                            ${currentItem.images.map((img, idx) => `
                                <button type="button" class="gallery-thumb-item ${idx === 0 ? 'active' : ''}" data-gallery-image="${escapeHTML(safeHttpUrl(img, DEFAULT_LISTING_IMAGE))}" aria-label="عرض صورة الإعلان ${idx + 1}" aria-pressed="${idx === 0}">
                                    <img src="${escapeHTML(safeHttpUrl(img, DEFAULT_LISTING_IMAGE))}" alt="صورة ${idx + 1}">
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}

                    <!-- Specifications Table -->
                    <h3 style="font-size: 18px; font-weight: 800; margin: 32px 0 16px;">المواصفات والتفاصيل الأساسية</h3>
                    <div class="specs-grid">
                        ${Object.entries(currentItem.specs || {}).map(([key, val]) => `
                            <div class="spec-item">
                                <span class="spec-title">${escapeHTML(key)}</span>
                                <span class="spec-val">${escapeHTML(val)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Description -->
                    <h3 style="font-size: 18px; font-weight: 800; margin: 32px 0 12px;">وصف الإعلان كامل</h3>
                    <p style="font-size: 15px; color: var(--text-main); line-height: 1.8; white-space: pre-line;">${escapeHTML(currentItem.description).replace(/\*\*/g, '')}</p>
                </div>

                <!-- Comments & Replies Section -->
                <div class="comments-section-box">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color);">
                        <h3 style="font-size: 20px; font-weight: 800;"><i class="fa-regular fa-comments" style="color: var(--color-primary);"></i> الأسئلة والردود (${currentItem.comments.length})</h3>
                    </div>

                    <div id="commentsListContainer">
                        ${currentItem.comments.length ? currentItem.comments.map((c) => `
                            <div class="comment-card">
                                <img src="${escapeHTML(safeHttpUrl(c.avatar, DEFAULT_AVATAR))}" class="comment-avatar" alt="${escapeHTML(c.author)}">
                                <div class="comment-content">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span style="font-weight: 800; font-size: 14px;">${escapeHTML(c.author)}</span>
                                        ${c.isSeller ? '<span class="seller-badge-tag">صاحب الإعلان</span>' : '<span class="member-badge-tag">عضو</span>'}
                                        <span style="font-size: 11px; color: var(--text-muted); margin-right: auto;">${escapeHTML(c.time)}</span>
                                        
                                        ${(currentUser && (currentUser.id === c.userId || isOwner || currentUser.role === 'admin')) ? `
                                            <button class="btn-delete-comment" onclick="handleDeleteReply('${currentItem.id}', '${c.id}')" title="حذف هذا الرد">
                                                <i class="fa-solid fa-trash-can"></i> حذف الرد
                                            </button>
                                        ` : ''}
                                    </div>
                                    <p class="comment-text">${escapeHTML(c.text)}</p>
                                </div>
                            </div>
                        `).join('') : '<p style="text-align:center; color:var(--text-muted); padding:24px 8px;">لا توجد أسئلة بعد. كن أول من يسأل المعلن.</p>'}
                    </div>

                    <!-- Add Reply Form -->
                    ${currentUser ? `
                        <div class="add-reply-box">
                            <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--color-primary);">
                                <i class="fa-solid fa-pen"></i> أضف ردك (${escapeHTML(currentUser.name)})
                            </h4>
                            <textarea id="replyText" class="form-input" style="height: 90px; padding: 10px; margin-bottom: 12px;" placeholder="اكتب سؤالك أو استفسارك هنا..."></textarea>
                            <button class="btn btn-primary" onclick="submitListingReply('${currentItem.id}')">
                                <i class="fa-solid fa-paper-plane"></i> إرسال الرد فوراً
                            </button>
                        </div>
                    ` : `
                        <div style="background-color: #fffbebf5; border: 1.5px dashed #f59e0b; padding: 20px; border-radius: var(--radius-md); text-align: center; margin-top: 20px;">
                            <h4 style="font-size: 16px; font-weight: 800; color: #92400e; margin-bottom: 6px;">الردود مخصصة للأعضاء المشتركين فقط</h4>
                            <button class="btn btn-primary" onclick="window.location.href='index.html?login=1&next=${encodeURIComponent(`listing.html?id=${currentItem.id}`)}'">
                                <i class="fa-solid fa-user-check"></i> تسجيل الدخول من الرئيسية للرد
                            </button>
                        </div>
                    `}
                </div>
            `;

            // Render Sidebar Column with Real Interactive Rating Widget
            const sidebarCol = document.getElementById('sidebarListingCol');
            const sellerObj = currentItem.seller || { name: 'معلن', phone: '', rating: 0, verified: false, avatar: DEFAULT_AVATAR };
            const whatsappNumber = safeWhatsAppNumber(sellerObj.phone);
            const whatsappMessage = encodeURIComponent(`مرحباً، أتواصل معك بخصوص إعلان: ${currentItem.title}\n${window.location.href}`);

            sidebarCol.innerHTML = `
                <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 24px; position: sticky; top: 96px;">
                    <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px;">السعر المطلوب:</div>
                    <div style="font-size: 32px; font-weight: 900; color: var(--color-primary); margin-bottom: 20px;">${formattedPrice}</div>

                    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                        ${currentUser && sellerObj.phone ? `
                            <button type="button" class="btn btn-primary" id="showSellerPhoneButton" style="height: 44px; font-size: 14px;" onclick="revealSellerContact()">
                                <i class="fa-solid fa-phone"></i> إظهار رقم المعلن
                            </button>
                            <div id="sellerContactActions" hidden>
                                <div class="seller-phone-display"><i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i> <bdi>${escapeHTML(sellerObj.phone)}</bdi></div>
                                <div class="seller-contact-buttons">
                                    <a href="tel:${escapeHTML(safeTel(sellerObj.phone))}" class="btn btn-outline"><i class="fa-solid fa-phone"></i> اتصال</a>
                                    ${whatsappNumber ? `<a href="https://wa.me/${escapeHTML(whatsappNumber)}?text=${whatsappMessage}" target="_blank" rel="noopener noreferrer" class="btn whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> واتساب</a>` : ''}
                                </div>
                            </div>
                        ` : `
                            <a href="index.html?login=1&next=${encodeURIComponent(`listing.html?id=${currentItem.id}`)}" class="btn btn-primary" style="height: 48px; font-size: 16px;">
                                <i class="fa-solid fa-lock"></i> سجل الدخول لإظهار وسيلة التواصل
                            </a>
                        `}
                        ${currentUser && !isOwner ? `
                            <a href="index.html?chat=${encodeURIComponent(currentItem.id)}" class="btn btn-outline" style="height: 48px; font-size: 16px;">
                                <i class="fa-regular fa-comments"></i> مراسلة المعلن
                            </a>
                        ` : ''}
                    </div>

                    <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${escapeHTML(safeHttpUrl(sellerObj.avatar, DEFAULT_AVATAR))}" alt="صورة المعلن ${escapeHTML(sellerObj.name)}" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover;">
                            <div>
                                <h4 style="font-size: 16px; font-weight: 800;">${escapeHTML(sellerObj.name)} ${sellerObj.verified ? '<i class="fa-solid fa-circle-check" style="color: #0063fb;"></i>' : ''}</h4>
                                <span style="font-size: 13px; color: var(--text-muted);">${sellerObj.verified ? 'هوية المعلن موثقة' : 'عضو في FinnMarket'}</span>
                            </div>
                        </div>

                        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">
                            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
                                <strong style="font-size:13px;">تقييمات المعلن</strong>
                                <span id="sellerRatingDisplay" style="font-size:13px; color:var(--text-muted);">${currentItem.ratingStats?.count ? `${currentItem.ratingStats.average} من 5 (${currentItem.ratingStats.count})` : 'لا توجد تقييمات'}</span>
                            </div>
                            ${currentItem.ratingStats?.count ? `<div style="display:grid;gap:4px;margin:10px 0;">${[5,4,3,2,1].map(score => { const amount = Number(currentItem.ratingStats.distribution?.[score] || 0); const width = Math.round(amount * 100 / currentItem.ratingStats.count); return `<div style="display:grid;grid-template-columns:28px 1fr 24px;gap:6px;align-items:center;font-size:11px;"><span>${score}★</span><span style="height:6px;background:#e5e7eb;border-radius:9px;overflow:hidden;"><i style="display:block;width:${width}%;height:100%;background:#f59e0b;"></i></span><span>${amount}</span></div>`; }).join('')}</div>` : ''}
                            ${!isOwner ? `
                                <label class="filter-label" for="ratingReviewText">تعليق التقييم (اختياري)</label>
                                <textarea id="ratingReviewText" class="form-input" maxlength="1000" style="height:70px;padding:9px;" placeholder="شارك تجربتك باحترام..."></textarea>
                                <div style="display:flex; gap:4px;" aria-label="تقييم المعلن من خمس نجوم">
                                    ${[1,2,3,4,5].map(score => `<button type="button" class="star-btn" style="font-size:24px; border:0; background:transparent; color:#f59e0b; cursor:pointer;" onclick="submitSellerRating(${score})" aria-label="تقييم المعلن ${score} من 5 نجوم">★</button>`).join('')}
                                </div>
                                <small style="color:var(--text-muted);">يمكنك تعديل تقييمك باختيار نجمة أخرى.</small>
                            ` : ''}
                            <div style="margin-top:16px;display:grid;gap:10px;">${(currentItem.ratingStats?.reviews || []).map(review => `<article style="border:1px solid var(--border-color);border-radius:10px;padding:10px;"><div style="display:flex;justify-content:space-between;gap:8px;"><strong>${escapeHTML(review.reviewerName)}</strong><span style="color:#f59e0b;">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span></div>${review.reviewText ? `<p style="font-size:13px;margin-top:6px;white-space:pre-wrap;">${escapeHTML(review.reviewText)}</p>` : ''}${review.sellerReply ? `<div style="margin-top:8px;padding:8px;background:#f8fafc;border-radius:8px;font-size:12px;"><strong>رد المعلن:</strong> ${escapeHTML(review.sellerReply)}</div>` : ''}<div style="display:flex;gap:6px;margin-top:8px;">${isOwner ? `<button type="button" class="btn btn-outline" style="height:30px;font-size:11px;" onclick="replyToRating('${review.id}')">${review.sellerReply ? 'تعديل الرد' : 'الرد'}</button>` : ''}${currentUser ? `<button type="button" class="btn btn-outline" style="height:30px;font-size:11px;color:var(--color-danger);" onclick="openReportModal('${review.id}')">إبلاغ عن التقييم</button>` : ''}</div></article>`).join('')}</div>
                        </div>
                    </div>
                </div>
            `;

            mainCol.querySelectorAll('[data-gallery-image]').forEach((thumb) => {
                thumb.addEventListener('click', () => switchPageImg(thumb.dataset.galleryImage, thumb));
            });
        }

        function revealSellerContact() {
            const button = document.getElementById('showSellerPhoneButton');
            const actions = document.getElementById('sellerContactActions');
            if (button) button.hidden = true;
            if (actions) actions.hidden = false;
        }

        async function togglePageFav(id) {
            try {
                await finnDB.toggleFavorite(id);
                await renderHeaderAuth();
                await renderListingPageContent();
            } catch (error) {
                alert(error.message || 'تعذر تحديث المفضلة.');
            }
        }

        function switchPageImg(src, el) {
            document.getElementById('mainHeroImg').src = src;
            document.querySelectorAll('.gallery-thumb-item').forEach(item => {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });
            el.classList.add('active');
            el.setAttribute('aria-pressed', 'true');
        }

        async function submitSellerRating(score) {
            if (!currentUser) {
                window.location.href = `index.html?login=1&next=${encodeURIComponent(`listing.html?id=${currentItem.id}`)}`;
                return;
            }
            try {
                const reviewText = document.getElementById('ratingReviewText')?.value || '';
                currentItem.ratingStats = await finnDB.rateSeller(currentItem.id, currentItem.userId, score, reviewText);
                await renderListingPageContent();
                alert('تم حفظ تقييمك بنجاح.');
            } catch (error) {
                alert(error.message || 'تعذر حفظ التقييم.');
            }
        }

        function openReportModal(ratingId = null) {
            if (!currentUser) {
                window.location.href = `index.html?login=1&next=${encodeURIComponent(`listing.html?id=${currentItem.id}`)}`;
                return;
            }
            const modal = document.getElementById('reportModal');
            activeReportRatingId = ratingId || null;
            document.getElementById('reportDialogTitle').innerHTML = `<i class="fa-solid fa-flag" style="color: var(--color-danger);"></i> ${activeReportRatingId ? 'الإبلاغ عن التقييم' : 'الإبلاغ عن الإعلان'}`;
            reportReturnFocus = document.activeElement;
            modal.hidden = false;
            modal.inert = false;
            modal.setAttribute('aria-hidden', 'false');
            modal.classList.add('active');
            window.setTimeout(() => document.getElementById('reportReason')?.focus(), 0);
        }

        function closeReportModal() {
            const modal = document.getElementById('reportModal');
            modal?.classList.remove('active');
            if (modal) {
                modal.setAttribute('aria-hidden', 'true');
                modal.inert = true;
                modal.hidden = true;
            }
            if (reportReturnFocus?.isConnected) reportReturnFocus.focus();
            reportReturnFocus = null;
            activeReportRatingId = null;
        }

        async function submitListingReport() {
            const input = document.getElementById('reportReason');
            const category = document.getElementById('reportCategory');
            const evidenceInput = document.getElementById('reportEvidence');
            const button = document.getElementById('submitReportButton');
            if (input?.value.trim() && input.value.trim().length < 5) {
                alert('اجعل التفاصيل 5 أحرف على الأقل، أو اتركها فارغة.');
                return;
            }
            const evidenceUrls = (evidenceInput?.value || '').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
            button.disabled = true;
            try {
                if (activeReportRatingId) await finnDB.submitRatingReport(activeReportRatingId, category.value, input.value, evidenceUrls);
                else await finnDB.submitReport(currentItem.id, { category: category.value, details: input.value, evidenceUrls });
                input.value = '';
                evidenceInput.value = '';
                closeReportModal();
                alert('تم إرسال البلاغ للمشرفين وسيتم مراجعته.');
            } catch (error) {
                alert(error.message || 'تعذر إرسال البلاغ.');
            } finally {
                button.disabled = false;
            }
        }

        async function replyToRating(ratingId) {
            const reply = prompt('اكتب ردًا مهنيًا على التقييم (2–1000 حرف):', '');
            if (reply === null) return;
            try {
                await finnDB.replyToSellerRating(ratingId, reply);
                currentItem.ratingStats = await finnDB.getSellerRating(currentItem.userId);
                await renderListingPageContent();
            } catch (error) { alert(error.message || 'تعذر حفظ الرد.'); }
        }

        async function handleDeleteAd(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الإعلان نهائياً؟')) {
                await finnDB.deleteListing(id);
                alert('تم حذف الإعلان بنجاح.');
                window.location.href = 'index.html';
            }
        }

        async function handleDeleteReply(listingId, commentId) {
            if (confirm('هل ترغب في حذف هذا الرد نهائياً؟')) {
                try {
                    currentItem.comments = await finnDB.deleteComment(listingId, commentId);
                    await renderListingPageContent();
                } catch (error) {
                    alert(error.message || 'تعذر حذف الرد.');
                }
            }
        }

        async function submitListingReply(listingId) {
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }

            const textInput = document.getElementById('replyText');
            if (!textInput || !textInput.value.trim()) {
                alert('يرجى كتابة نص الرد أولاً.');
                return;
            }

            try {
                currentItem.comments = await finnDB.addComment(listingId, textInput.value);
                await renderListingPageContent();
            } catch (error) {
                alert(error.message || 'تعذر نشر الرد.');
            }
        }
    </script>
</body>
</html>
