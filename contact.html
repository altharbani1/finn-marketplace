<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التواصل والشكاوى | FinnMarket</title>
    <meta name="description" content="تواصل مع فريق FinnMarket للدعم أو الشكاوى أو طلبات الخصوصية والبيانات.">
    <link rel="canonical" href="https://fann1.netlify.app/contact.html">
    <link rel="stylesheet" href="css/main.css?v=9.0">
    <link rel="stylesheet" href="css/legal.css?v=1.0">
</head>
<body>
    <header class="navbar"><div class="container navbar-inner"><a href="/" class="brand-logo"><span>FinnMarket</span><span class="brand-badge">تواصل معنا</span></a></div></header>
    <main class="container legal-shell">
        <section class="legal-hero"><h1>التواصل والشكاوى</h1><p>للدعم، أو الاعتراض على محتوى، أو ممارسة حقوق الخصوصية والوصول والتصحيح.</p></section>
        <section class="legal-card" aria-labelledby="contactTitle">
            <h2 id="contactTitle">إرسال طلب</h2>
            <p>سنستخدم بيانات النموذج لمعالجة الطلب فقط. لا ترسل كلمات مرور أو بيانات مالية أو صور هوية.</p>
            <form name="contact-and-rights" method="POST" action="/thank-you" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="contact-and-rights">
                <p hidden><label>اترك هذا الحقل فارغًا <input name="bot-field"></label></p>
                <div class="legal-form-field"><label for="contactName">الاسم</label><input class="form-input" id="contactName" name="name" maxlength="100" required></div>
                <div class="legal-form-field"><label for="contactEmail">البريد الإلكتروني</label><input class="form-input" id="contactEmail" name="email" type="email" autocomplete="email" maxlength="254" required></div>
                <div class="legal-form-field"><label for="contactType">نوع الطلب</label><select class="form-input" id="contactType" name="request_type" required><option value="">اختر</option><option value="support">دعم فني</option><option value="complaint">شكوى أو اعتراض</option><option value="privacy-access">طلب الوصول إلى البيانات</option><option value="privacy-correction">طلب تصحيح البيانات</option><option value="privacy-deletion">مساعدة في حذف الحساب</option></select></div>
                <div class="legal-form-field"><label for="contactMessage">التفاصيل</label><textarea class="form-input" id="contactMessage" name="message" rows="6" minlength="10" maxlength="3000" required></textarea></div>
                <button class="btn btn-primary" type="submit">إرسال الطلب</button>
            </form>
        </section>
    </main>
    <footer class="site-footer"><div class="container site-footer-inner"><p>© 2026 FinnMarket</p><nav class="site-footer-links" aria-label="روابط معلوماتية"><a href="about.html">عن المنصة</a><a href="privacy.html">الخصوصية</a><a href="terms.html">الشروط</a><a href="safety.html">الأمان</a><a href="contact.html" aria-current="page">التواصل</a></nav></div></footer>
</body>
</html>
